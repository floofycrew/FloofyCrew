name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  de-amazon:
    # The shared core must be publishable as-is: no internal hostnames, package
    # names or identifiers outside the edition adapters (Requirement 10.2).
    name: no internal identifiers in the shared core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_no_internal_identifiers.py

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest
