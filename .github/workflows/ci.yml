name: ci

# The public repository's CI (design "Public CI identifier gate"; Requirement 1.2,
# 6.3). Two jobs, both required status checks on `main` (cut-over step 4): the
# deterministic identifier gate `de-amazon` and `pytest`. Nothing here reviews,
# exports or filters a derived tree — the tree that is pushed is the tree that
# ships, and no AI review is ever a gate (Requirement 6.3). The both-edition
# measurements (`two-track`) need the internal edition adapter, which only the
# overlay's composed tree has, so they run in the overlay's own CI.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  de-amazon:
    # No Amazon-internal hostname, package name or identifier anywhere in the
    # tree (Requirement 1.2). The identifier list itself stays in the overlay; the
    # public tree carries its hashed form, scripts/internal-identifiers.sha256
    # (written by the overlay's tools/hash-identifiers.py, whose --check in the
    # overlay CI refuses a stale copy), and the scanner's --hashed mode hashes
    # candidate substrings of the text and looks the digests up — so the gate
    # runs on forks and pull requests with no secret, and a hit names the file,
    # the line and the matched text. The job's display name is the required
    # status check's name.
    name: de-amazon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No internal identifiers anywhere in the tree (hashed list)
        run: python scripts/check_no_internal_identifiers.py --paths . --allowlist scripts/public-export-allow.txt --hashed scripts/internal-identifiers.sha256

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest
