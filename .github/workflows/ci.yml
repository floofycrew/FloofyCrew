name: ci

# The public repository's CI (Requirement 6.3). One job, the required status
# check on `main`: `pytest`. Nothing here reviews, exports or filters a derived
# tree — the tree that is pushed is the tree that ships, and no AI review is
# ever a gate (Requirement 6.3). The both-edition measurements (`two-track`)
# need the internal edition adapter, which only the overlay's composed tree
# has, so they run in the overlay's own CI.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest
