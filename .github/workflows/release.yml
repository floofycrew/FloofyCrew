name: release

# The public track (task 9.2; Requirement 10.4, 10.5): a `vX.Y.Z` (or `floofycrew-vX.Y.Z`)
# tag builds the public release tree twice (byte-identical), refuses internal
# identifiers in the artifacts, measures the byte-identity across editions and
# installs the same mod archive on both, installs the wheel into a scratch venv,
# attaches the assets to the GitHub release and publishes the Loader app tree to
# the generated `loader-app` branch (a federated app registry the host can clone).
# The public registry is NOT written here: it has one writer — the Forge's
# direct signed commit (records, matrix rows, the stamped index) on the
# registry's `main` (public-first design DR-9). A hand-cut release stamps the
# index from the public clone with `python -m registry_tools stamp <registry
# clone> [--sign KEY] --commit` and pushes that commit itself. FloofyCrew is
# unofficial and ships only its own artifacts — the KiroCrew host is never
# rebuilt or redistributed (design DR-1).

on:
  push:
    tags:
      - "v*"
      - "floofycrew-v*"

permissions:
  contents: write

jobs:
  release:
    name: build, verify, publish
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag names the checked-out version
        run: |
          VERSION=$(python -c 'import re, pathlib; print(re.search(r"^__version__ = \"([^\"]+)\"", pathlib.Path("floofy-core/floofy_core/__init__.py").read_text(), re.M).group(1))')
          case "$TAG" in
            "v$VERSION"|"floofycrew-v$VERSION") echo "floofycrew $VERSION ($TAG)" ;;
            *) echo "tag $TAG does not match floofy_core.__version__ $VERSION" >&2; exit 1 ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build the public release tree (twice, byte-identical)
        run: |
          python packaging/public/build.py --check --tag "$TAG"
          python packaging/public/build.py --out build/public --tag "$TAG"
          cat build/public/dist/SHA256SUMS

      - name: No internal identifiers in the public artifacts
        # The identifier list is not part of the public tree (the exporter drops it), so in
        # a public checkout this step only confirms the scanner runs; the authoritative
        # scan happens in the source tree on every export, before anything reaches here.
        run: |
          python scripts/check_no_internal_identifiers.py --paths build/public/app build/public/install.sh build/public/README.md build/public/RELEASE.md build/public/app-registry.json
          rm -rf /tmp/wheel && mkdir /tmp/wheel && (cd /tmp/wheel && unzip -q "$GITHUB_WORKSPACE"/build/public/dist/floofycrew-*.whl)
          python scripts/check_no_internal_identifiers.py --root /tmp/wheel --allowlist /dev/null --paths floofy_core floofy_edition_public "floofycrew-$VERSION.dist-info"

      - name: Byte-identity across editions (>= 80 % of shipped files) and the same archive on both
        # Provable only where both edition adapters exist — the internal source
        # tree, whose CI and test suite run these before every export. The
        # public export carries only the public adapter, so the two-track
        # measurements are attested pre-export and skipped here.
        run: |
          if [ -d editions/toolbox ]; then
            python scripts/artifact_identity_report.py
            python scripts/install_both_editions.py
          else
            echo "internal edition adapter absent (public export): two-track measurements ran in the source tree before export"
          fi

      - name: The wheel installs into a scratch venv and floofy runs
        run: |
          python -m venv /tmp/floofy-venv
          /tmp/floofy-venv/bin/python -m pip install --quiet --no-index --no-deps build/public/dist/floofycrew-*.whl
          /tmp/floofy-venv/bin/floofy --version
          /tmp/floofy-venv/bin/floofy --help > /dev/null

      - name: The app-registry row is what the host's reader accepts
        run: |
          PYTHONPATH=floofy-core:registry-tools python - <<'EOF'
          import json
          from registry_tools.app_registry import BRANCH_RE, is_git_url
          rows = json.load(open("build/public/app-registry.json", encoding="utf-8"))
          assert isinstance(rows, list) and len(rows) == 1, rows
          row = rows[0]
          assert row["name"] == "floofycrew" and is_git_url(row["gitUrl"]) and row["gitUrl"] == row["repo"], row
          assert BRANCH_RE.match(row["branch"]) and row["subdirectory"] == "app/floofycrew", row
          print("app-registry.json row ok:", row)
          EOF

      - name: Publish the Loader app tree to the loader-app branch
        # The generated tree (no binaries: those are release assets) on an orphan
        # branch, force-updated per release, plus an immutable copy under the tag
        # loader-app-<tag> — the branch app-registry.json pins to.
        run: |
          set -eu
          WORK=$(mktemp -d)
          cp -r build/public/app build/public/app-registry.json build/public/install.sh build/public/README.md build/public/RELEASE.md build/public/.gitignore "$WORK/"
          mkdir -p "$WORK/dist" && cp build/public/dist/SHA256SUMS "$WORK/dist/"
          [ -f build/public/dist/supports.json ] && cp build/public/dist/supports.json "$WORK/dist/" || true
          cd "$WORK"
          git init -q -b loader-app
          git config user.name "floofycrew-release"
          git config user.email "floofycrew-release@users.noreply.github.com"
          git add -A
          git commit -q -m "chore(release): Loader app tree for floofycrew $TAG"
          git tag "loader-app-$TAG"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" loader-app "loader-app-$TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the GitHub release with the assets
        run: gh release create "$TAG" build/public/dist/* --repo "$GITHUB_REPOSITORY" --title "floofycrew v$VERSION" --notes-file build/public/RELEASE.md --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
